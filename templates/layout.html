<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheos - Layout-Padrão</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --fire-red-dark: #D32F2F;
            --fire-red-primary: #E64A19;
            --fire-orange: #FF5722;
            --fire-amber: #FF9800;
            --purple-dark: #18052B;
            --purple-mid: #4A148C;
            --purple-light: #7B1FA2;
            --bg-main: #ffffff;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
            --topbar-height: 55px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: #212529;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--purple-dark) 0%, var(--purple-mid) 50%, #2A0845 100%);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        #sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            min-width: var(--sidebar-collapsed-width);
        }

        .sidebar-brand-wrapper {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.85rem 0 1.25rem;
            background-color: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--fire-orange), var(--fire-red-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(230, 74, 25, 0.4);
        }

        .brand-text {
            font-size: 1.25rem;
            font-weight: 800;
            margin-left: 0.75rem;
            background: linear-gradient(135deg, #ffffff 0%, #ffccbc 50%, #ff9800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            transition: opacity 0.2s;
        }

        #sidebar.collapsed .brand-text {
            opacity: 0;
            display: none;
        }

        .btn-sidebar-collapse {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
        }

        .btn-sidebar-collapse:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        #sidebar.collapsed .btn-sidebar-collapse {
            margin: 0 auto;
        }

        #sidebar.collapsed .btn-sidebar-collapse i {
            transform: rotate(180deg);
        }

        .sidebar-menu {
            padding: 1rem 0.75rem;
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-menu .menu-header {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #b388ff;
            padding: 0.85rem 0.85rem 0.35rem;
            white-space: nowrap;
            opacity: 0.85;
        }

        #sidebar.collapsed .sidebar-menu .menu-header {
            display: none;
        }

        .nav-item-link {
            display: flex;
            align-items: center;
            padding: 0.7rem 0.85rem;
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-item-link i {
            font-size: 1.7rem;
            width: 26px;
            min-width: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff8a65;
            transition: color 0.2s ease;
        }

        .nav-item-link .link-text {
            margin-left: 0.5rem;
            transition: opacity 0.2s;
        }

        #sidebar.collapsed .nav-item-link .link-text {
            opacity: 0;
            display: none;
        }

        .nav-item-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item-link:hover i {
            color: var(--fire-amber);
        }

        .nav-item-link.active {
            color: #ffffff;
            background: linear-gradient(90deg, rgba(230, 74, 25, 0.4) 0%, rgba(123, 31, 162, 0.4) 100%);
            border-left: 4px solid var(--fire-orange);
            font-weight: 600;
        }

        .nav-item-link.active i {
            color: #ffffff;
        }

        .sidebar-footer {
            padding: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
        }

        .user-pill {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            padding: 0.4rem 0.5rem;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }

        .user-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple-light), var(--fire-red-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .user-info {
            margin-left: 0.75rem;
            overflow: hidden;
            white-space: nowrap;
        }

        #sidebar.collapsed .user-info {
            display: none;
        }

        #content-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
            background-color: var(--bg-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        #content-wrapper.expanded {
            margin-left: var(--sidebar-collapsed-width);
            width: calc(100% - var(--sidebar-collapsed-width));
        }

        .top-navbar {
            height: var(--topbar-height);
            background-color: #ffffff;
            border-bottom: 1px solid #f1f3f5;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        @media (max-width: 991.98px) {
            #sidebar {
                margin-left: calc(-1 * var(--sidebar-width));
            }
            #sidebar.mobile-open {
                margin-left: 0;
            }
            #content-wrapper {
                margin-left: 0 !important;
                width: 100% !important;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.5);
                backdrop-filter: blur(2px);
                z-index: 999;
            }
            .sidebar-overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- BARRA LATERAL (SIDEBAR) -->
        <nav id="sidebar">
            <div class="sidebar-brand-wrapper">
                <a href="" class="sidebar-brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-fire-flame-curved"></i>
                    </div>
                    <span class="brand-text">PROMETHEOS</span>
                </a>
            
            </div>

            <!-- Menu da Sidebar -->
            <div class="sidebar-menu">
                <div class="menu-header">Menu Principal</div>

                <a href="{% url 'dashboard' %}"
                class="nav-item-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                title="Início">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span class="link-text">Dashboard</span>
                </a>
                <a href="{% url 'eventoFogo'%}"
                class="nav-item-link {% if 'eventoFogo' in request.resolver_match.url_name %}active{% endif %}"
                title="Ocorrências">
                    <i class="bi bi-fire"></i>
                    <span class="link-text">Eventos de Fogo</span>
                </a>
                <a href="{% url 'ordemServico'%}"
                class="nav-item-link {% if 'ordemServico' in request.resolver_match.url_name %}active{% endif %}"
                title="Ocorrências">
                    <i class="fa-solid fa-fire-extinguisher"></i>
                    <span class="link-text">Ordem de Serviço</span>
                </a>
                <a href="{% url 'relatorioOcorrencia'%}"
                class="nav-item-link {% if 'relatorioOcorrencia' in request.resolver_match.url_name %}active{% endif %}"
                title="Ocorrências">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span class="link-text">Relatórios de Ocorrência</span>
                </a>
                <a href="#" class="nav-item-link" title="Equipes">
                    <i class="bi bi-people-fill"></i>
                    <span class="link-text">Equipes e Brigadas</span>
                </a>
                <a href="#" class="nav-item-link" title="Relatórios">
                    <i class="bi bi-file-earmark-bar-graph-fill"></i>
                    <span class="link-text">Relatórios</span>
                </a>
                <a href="#" class="nav-item-link" title="Configurações">
                    <i class="bi bi-gear-fill"></i>
                    <span class="link-text">Configurações</span>
                </a>
            </div>

            <!-- Rodapé / Perfil do Operador -->
            <div class="sidebar-footer">
                <div class="dropdown">
                    <a href="#" class="user-pill dropdown-toggle" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-avatar">CB</div>
                        <div class="user-info">
                            <div class="fw-bold text-truncate" style="max-width: 120px; font-size: 0.82rem;">Corpo de Bombeiros</div>
                            <div class="text-muted text-truncate" style="max-width: 120px; font-size: 0.72rem; color: #b388ff !important;">Operador</div>
                        </div>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark shadow border-0" aria-labelledby="userMenuDropdown">
                        <li><a class="dropdown-item py-2" href="#"><i class="bi bi-person me-2"></i>Meu Perfil</a></li>
                        <li><a class="dropdown-item py-2" href="#"><i class="bi bi-sliders me-2"></i>Configurações</a></li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="content-wrapper">

            <header class="top-navbar"></header>

            <main id="main-content" class="flex-grow-1 p-4">
                {% block content %}

                {% endblock %}
            </main>
